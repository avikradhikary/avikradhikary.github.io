<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment Submission</title>
  <style>
    .banner {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: bold;
    }
    .expired-banner {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: none;
    }
    input:disabled, button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Deadline expired alert message -->
  <div id="deadline-banner" class="banner expired-banner">
    ⚠️ The submission deadline has passed (Beijing Standard Time, UTC+8). Submissions are now closed.
  </div>

  <form id="submission-form">
    <div>
      <label for="token">Submission Token / Credentials:</label><br>
      <input type="text" id="token" name="token" required>
    </div>
    <br>
    <div>
      <label for="file-upload">Attachment:</label><br>
      <input type="file" id="file-upload" name="file" required>
    </div>
    <br>
    <button type="submit" id="submit-btn">Submit Assignment</button>
  </form>

  <script>
    // 1. Define deadline explicitly in Beijing Standard Time (UTC+8)
    // Format: YYYY-MM-DDTHH:mm:ss+08:00
    const BEIJING_DEADLINE_STR = "2026-10-15T23:59:59+08:00"; 
    const deadline = new Date(BEIJING_DEADLINE_STR);

    function validateDeadline() {
      const now = new Date(); // JavaScript automatically compares against absolute UTC timestamp

      if (now > deadline) {
        // Show expired message
        document.getElementById("deadline-banner").style.display = "block";

        // Disable input fields and submit button to prevent upload attempts
        document.getElementById("submit-btn").disabled = true;
        document.getElementById("token").disabled = true;
        document.getElementById("file-upload").disabled = true;

        return false; // Deadline expired
      }
      return true; // Deadline active
    }

    // Check deadline as soon as the page loads
    window.addEventListener("DOMContentLoaded", validateDeadline);

    // Check deadline on form submission attempt
    document.getElementById("submission-form").addEventListener("submit", function(e) {
      if (!validateDeadline()) {
        e.preventDefault(); // Stop form submission
        alert("Submission rejected: The deadline (Beijing Time) has already passed.");
      }
    });
  </script>
</body>
</html>
