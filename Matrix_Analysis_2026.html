<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Submission Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { margin-top: 0; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { background: #2ea44f; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2c974b; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Submit Assignment</h2>
    <form id="uploadForm">
        <div class="form-group">
            <label for="studentName">Your Full Name / ID:</label>
            <input type="text" id="studentName" required placeholder="e.g., John Doe - 10234">
        </div>
        <div class="form-group">
            <label for="assignmentFile">Select File (PDF, ZIP, DOCX):</label>
            <input type="file" id="assignmentFile" required>
        </div>
        <button type="submit" id="submitBtn">Submit Assignment</button>
    </form>
    <div id="status"></div>
</div>

<script>
const WORKER_URL = 'https://assignment-proxy.avikranjanadhikary.workers.dev/'; // e.g. https://assignment-proxy.subdomain.workers.dev

document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    const st = document.getElementById('status');
    const nameInput = document.getElementById('studentName').value.trim();
    const fileInput = document.getElementById('assignmentFile').files[0];

    if (!fileInput) return alert('Please select a file.');

    btn.disabled = true;
    st.style.color = '#0070f3';
    st.innerText = 'Uploading submission...';

    try {
        const base64Content = await toBase64(fileInput);
        const safeName = nameInput.replace(/[^a-zA-Z0-9]/g, '_');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        const filename = `${safeName}_${timestamp}_${fileInput.name}`;

        const response = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                filename: filename,
                content: base64Content,
                studentName: nameInput
            })
        });

        if (response.ok) {
            st.style.color = 'green';
            st.innerText = 'Assignment submitted successfully!';
            document.getElementById('uploadForm').reset();
        } else {
            const errData = await response.json();
            throw new Error(errData.message || 'Upload failed');
        }
    } catch (err) {
        st.style.color = 'red';
        st.innerText = 'Error: ' + err.message;
    } finally {
        btn.disabled = false;
    }
});

function toBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
    });
}
</script>

</body>
</html>
